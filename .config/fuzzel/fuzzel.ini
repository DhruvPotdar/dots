[main]
font=Iosevka RadTop:size=11
dpi-aware=yes
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
match-mode=fzf
match-counter=yes
fields=filename,name,generic
lines=18
width=55
horizontal-pad=16
vertical-pad=8
inner-pad=4
image-size-ratio=0.9
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes
terminal=kitty -e
placeholder=Search...
prompt='❯ '

[colors]
# Kanagawa Dragon — matched to kitty current-theme.conf
background=0d0c0cf0
text=C5C9C7ff
prompt=8ba4b0ff
placeholder=A4A7A4ff
input=C5C9C7ff
match=E6C384ff
selection=2D4F67ff
selection-text=C5C9C7ff
selection-match=E6C384ff
counter=A4A7A4ff
border=4f4f68ff

[border]
width=1
radius=8

[dmenu]
mode=text
exit-immediately-if-empty=yes
