source=~/.config/hypr/hyprlock/colors.conf

auth {
    fingerprint {
        enabled = true
        ready_message = Touch fingerprint sensor to unlock
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    brightness = 0.55
    contrast = 1.0
    noise = 0.02
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $accent_color
    font_size = 72
    font_family = $font_family_clock

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"  %A,  %d %B"
    color = $text_muted
    font_size = 16
    font_family = $font_family

    position = 0, 95
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =  $USER
    color = $text_color
    font_size = 18
    font_family = $font_family

    position = 0, -28
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $text_color
    placeholder_text = <span foreground="##A4A7A4"> 󰌆  enter password...</span>
    fade_on_empty = true
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL  ($ATTEMPTS)</i>
    capslock_color = $warn_color

    position = 0, 80
    halign = center
    valign = bottom
}

# Fingerprint prompt
label {
    monitor =
    text = $FPRINTPROMPT
    color = $text_muted
    font_size = 13
    font_family = $font_family

    position = 0, -132
    halign = center
    valign = center
}

# Caps lock warning
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $warn_color
    font_size = 13
    font_family = $font_family

    position = 0, -158
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $text_muted
    font_size = 12
    font_family = $font_family

    position = -30, 30
    halign = right
    valign = bottom
}

# Status (battery / system info)
label {
    monitor =
    text = cmd[update:10000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_muted
    font_size = 13
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}
